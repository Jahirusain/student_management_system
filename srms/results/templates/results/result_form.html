{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result Form</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

<style>
/* =========================== */
/* 🌈 Background Gradient + Floating Bubbles */
body {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
.bg-circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    animation: float 8s infinite ease-in-out;
}
.bg-circle:nth-child(1) { width: 100px; height: 100px; top: 5%; left: 10%; animation-delay: 0s; }
.bg-circle:nth-child(2) { width: 150px; height: 150px; top: 70%; left: 60%; animation-delay: 2s; }
.bg-circle:nth-child(3) { width: 60px; height: 60px; top: 40%; left: 40%; animation-delay: 4s; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-25px); } }

/* =========================== */
/* Card Style */
.card {
    border-radius: 2rem;
    padding: 35px;
    background: linear-gradient(145deg, #ffffff, #f3f7ff);
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    transform: translateY(20px);
    opacity: 0;
    animation: fadeInUp 0.8s forwards;
    transition: transform 0.3s, box-shadow 0.3s;
}
.card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}
@keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

/* =========================== */
/* Heading Animation */
h2 {
    color: #ff6a95;
    text-align: center;
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeInText 1s forwards;
}
@keyframes fadeInText { to { opacity:1; } }

/* =========================== */
/* Form Animations */
.fade-in {
    opacity: 0;
    transform: translateY(15px);
    animation: fadeInUp 0.6s forwards;
}
.fade-in.delay-1 { animation-delay: 0.2s; }
.fade-in.delay-2 { animation-delay: 0.4s; }
.fade-in.delay-3 { animation-delay: 0.6s; }
.fade-in.delay-4 { animation-delay: 0.8s; }
.fade-in.delay-5 { animation-delay: 1s; }

/* =========================== */
/* Form Inputs */
.form-control {
    border-radius: 12px;
    border: 2px solid transparent;
    padding: 12px 15px;
    transition: all 0.3s;
    background: linear-gradient(135deg, #fff, #e6f0ff);
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
}
.form-control:focus {
    border-color: #ff6a95;
    box-shadow: 0 0 15px rgba(255,106,149,0.4);
    outline: none;
}

/* =========================== */
/* Buttons */
.btn-primary {
    background: linear-gradient(135deg, #ff6a95, #ffb347);
    border: none;
    font-weight: 600;
    border-radius: 12px;
    transition: all 0.3s;
}
.btn-primary:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 25px rgba(255,106,149,0.5);
}
.btn-secondary {
    background: linear-gradient(135deg, #6a82fb, #fc5c7d);
    color: #fff;
    border-radius: 12px;
    transition: all 0.3s;
}
.btn-secondary:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 6px 20px rgba(106,130,251,0.5);
}
</style>
</head>

<body>

<!-- Floating Background Circles -->
<div class="bg-circle"></div>
<div class="bg-circle"></div>
<div class="bg-circle"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <h2 class="fade-in">🎓 Result Form</h2>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3 fade-in delay-1">
                        {{ form.student.label_tag }}
                        {{ form.student }}
                        
                    </div>
                    <div class="mb-3 fade-in delay-2">
                        {{ form.subject.label_tag }}
                        {{ form.subject }}
                    </div>
                    <div class="mb-3 fade-in delay-3">
                        {{ form.marks.label_tag }}
                        {{ form.marks }}
                    </div>
                    <div class="fade-in delay-4">
                        <button type="submit" class="btn btn-primary w-100">💾 Save</button>
                    </div>
                </form>

                <div class="mt-3 text-center fade-in delay-5">
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary w-100">
                        <i class="bi bi-arrow-left-circle me-1"></i> Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
